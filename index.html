<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silas' Brews & The Alchemist's Codex</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen flex flex-col selection:bg-purple-900 selection:text-white">

    <!-- HEADER -->
    <header class="bg-zinc-900 border-b border-zinc-800 p-4 shadow-xl">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex flex-col">
                <h1 class="text-2xl font-bold text-purple-500 tracking-wider">Silas' Brews</h1>
                <span class="text-xs text-zinc-400 font-mono">Integrated Apothecary & Codex</span>
            </div>

            <!-- NAVIGATION TABS -->
            <div class="flex gap-2 bg-zinc-950 p-1 rounded-lg border border-zinc-800">
                <button id="tab-store" class="nav-tab active px-4 py-2 text-sm font-semibold rounded transition-colors">Storefront</button>
                <button id="tab-codex" class="nav-tab px-4 py-2 text-sm font-semibold rounded text-zinc-500 hover:text-zinc-300 transition-colors">The Codex</button>
            </div>

            <!-- AUTH & ADMIN -->
            <div class="flex items-center gap-3">
                <button id="btn-open-login" class="bg-purple-900 hover:bg-purple-800 text-white px-4 py-1.5 rounded text-sm font-semibold transition-colors border border-purple-700">Sign In</button>
                <div id="logged-in-view" class="hidden flex items-center gap-3">
                    <button id="btn-open-admin" class="bg-zinc-800 hover:bg-zinc-700 text-purple-300 px-3 py-1.5 rounded text-sm font-semibold transition-colors border border-zinc-700">⚙️ Admin Panel</button>
                    <button id="btn-signout" class="bg-transparent hover:bg-zinc-800 text-zinc-400 px-3 py-1.5 rounded text-sm transition-colors">Sign Out</button>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 max-w-7xl mx-auto w-full p-6">
        
        <!-- ================= STOREFRONT VIEW ================= -->
        <section id="view-store" class="space-y-6">
            <div class="flex flex-col md:flex-row justify-between gap-4 bg-zinc-900 p-4 rounded-xl border border-zinc-800">
                <input type="text" id="store-search" placeholder="Search potions..." class="w-full md:w-64 bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-sm text-zinc-200">
                <div id="category-filters" class="flex flex-wrap gap-2">
                    <!-- Categories populate here -->
                </div>
            </div>
            
            <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                <!-- Potions populate here -->
                <p class="text-zinc-500 text-sm col-span-full">No potions available yet.</p>
            </div>
        </section>

        <!-- ================= CODEX VIEW ================= -->
        <section id="view-codex" class="hidden space-y-6">
            
            <!-- Guest Missive System -->
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5">
                <h2 class="text-lg font-bold text-zinc-100 mb-4">Submit a Missive</h2>
                <form id="missive-form" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="missive-author" placeholder="Your Name" required class="bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-sm">
                        <select id="missive-type" class="bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-sm">
                            <option value="price">Report a Price</option>
                            <option value="letter">General Letter</option>
                        </select>
                    </div>
                    <textarea id="missive-content" rows="3" placeholder="Provide price details or write your letter here..." required class="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-sm"></textarea>
                    <div class="flex justify-end">
                        <button type="submit" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-6 py-2 rounded text-sm font-semibold border border-zinc-700 transition-colors">Dispatch Missive</button>
                    </div>
                </form>
            </div>

            <!-- Price Database -->
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5">
                <h2 class="text-lg font-bold text-zinc-100 mb-4">Known Ingredient Prices</h2>
                <div id="price-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Prices populate here -->
                    <p class="text-zinc-500 text-sm col-span-full">No ingredients logged yet.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- FLOATING SATCHEL BUTTON -->
    <button id="floating-satchel" class="hidden fixed bottom-6 right-6 z-40 bg-purple-600 hover:bg-purple-500 text-white px-5 py-3 rounded-full font-bold shadow-lg shadow-purple-900/50 flex items-center gap-2 transition-transform hover:-translate-y-1">
        💼 Satchel (<span id="satchel-count">0</span>)
    </button>

    <!-- TOAST CONTAINER -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- MODALS -->
    <!-- 1. Login Modal -->
    <dialog id="modal-login" class="bg-transparent p-0 backdrop:bg-black/80 w-full max-w-sm m-auto">
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-6 relative shadow-2xl">
            <button class="close-modal absolute top-4 right-4 text-zinc-500 hover:text-white">✕</button>
            <h2 class="text-xl font-bold text-white mb-4">Enter Cellar</h2>
            <form id="auth-form" class="space-y-4">
                <input type="email" id="auth-email" placeholder="Email" required class="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-sm text-white">
                <input type="password" id="auth-password" placeholder="Password" required class="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-sm text-white">
                <button type="submit" class="w-full bg-purple-700 hover:bg-purple-600 text-white py-2 rounded text-sm font-semibold transition-colors">Sign In</button>
            </form>
        </div>
    </dialog>

    <!-- 2. Satchel Modal -->
    <dialog id="modal-satchel" class="bg-transparent p-0 backdrop:bg-black/80 w-full max-w-lg m-auto">
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-6 relative shadow-2xl text-zinc-100">
            <button class="close-modal absolute top-4 right-4 text-zinc-500 hover:text-white">✕</button>
            <h2 class="text-xl font-bold mb-4 text-purple-400">Your Satchel</h2>
            
            <div id="satchel-items" class="max-h-60 overflow-y-auto space-y-2 mb-4 pr-2"></div>
            <div class="text-right text-lg font-mono font-bold text-purple-400 border-t border-zinc-800 pt-3 mb-4">
                Total: <span id="satchel-total">0.0</span>g
            </div>

            <form id="order-form" class="space-y-3 bg-zinc-950 p-4 rounded border border-zinc-800">
                <input type="text" id="order-name" placeholder="Character Name *" required class="w-full bg-zinc-900 border border-zinc-700 rounded px-3 py-2 text-sm">
                <input type="text" id="order-discord" placeholder="Discord Handle (Optional)" class="w-full bg-zinc-900 border border-zinc-700 rounded px-3 py-2 text-sm">
                <textarea id="order-notes" rows="2" placeholder="Delivery Location / Notes" class="w-full bg-zinc-900 border border-zinc-700 rounded px-3 py-2 text-sm"></textarea>
                <button type="submit" class="w-full bg-purple-700 hover:bg-purple-600 text-white py-2 rounded text-sm font-semibold transition-colors">Submit Order Letter</button>
            </form>
        </div>
    </dialog>

    <!-- 3. Admin Dashboard Modal -->
    <dialog id="modal-admin" class="bg-transparent p-0 backdrop:bg-black/80 w-full max-w-3xl m-auto">
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-6 relative shadow-2xl text-zinc-100 flex flex-col max-h-[90vh]">
            <button class="close-modal absolute top-4 right-4 text-zinc-500 hover:text-white">✕</button>
            <h2 class="text-xl font-bold mb-4 text-purple-400">Admin Dashboard</h2>
            
            <div class="overflow-y-auto flex-1 pr-2 space-y-6">
                <!-- Batch Simulator -->
                <div class="bg-zinc-950 border border-zinc-800 rounded-lg p-4">
                    <h3 class="font-bold text-lg mb-2">Batch Brewing Simulator</h3>
                    <div class="flex gap-2 mb-3">
                        <select id="batch-potion-select" class="flex-1 bg-zinc-900 border border-zinc-700 rounded px-3 py-2 text-sm"><option value="">Select Potion...</option></select>
                        <input type="number" id="batch-qty" value="1" min="1" class="w-20 bg-zinc-900 border border-zinc-700 rounded px-3 py-2 text-sm text-center">
                        <button id="btn-add-batch" class="bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded text-sm border border-zinc-700 transition-colors">Add</button>
                    </div>
                    <div id="batch-queue" class="flex flex-wrap gap-2 mb-3"></div>
                    <div id="batch-results" class="bg-zinc-900 p-3 rounded font-mono text-xs text-zinc-300 min-h-[60px] whitespace-pre-wrap">Results will appear here.</div>
                </div>

                <!-- Database Management Tools (Placeholders for manual population forms) -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-zinc-950 border border-zinc-800 rounded-lg p-4">
                        <h3 class="font-bold mb-2">Add Potion</h3>
                        <form id="admin-add-potion" class="space-y-2">
                            <input type="text" id="add-pot-name" placeholder="Name" required class="w-full bg-zinc-900 border border-zinc-700 rounded px-3 py-2 text-sm">
                            <input type="text" id="add-pot-cat" placeholder="Category" class="w-full bg-zinc-900 border border-zinc-700 rounded px-3 py-2 text-sm">
                            <input type="number" id="add-pot-price" placeholder="Price" required class="w-full bg-zinc-900 border border-zinc-700 rounded px-3 py-2 text-sm">
                            <button type="submit" class="w-full bg-purple-900 hover:bg-purple-800 py-1.5 rounded text-sm">Save Potion</button>
                        </form>
                    </div>
                    <div class="bg-zinc-950 border border-zinc-800 rounded-lg p-4">
                        <h3 class="font-bold mb-2">Add Ingredient</h3>
                        <form id="admin-add-ingredient" class="space-y-2">
                            <input type="text" id="add-ing-name" placeholder="Ingredient Name" required class="w-full bg-zinc-900 border border-zinc-700 rounded px-3 py-2 text-sm">
                            <input type="number" id="add-ing-price" placeholder="Base Value" class="w-full bg-zinc-900 border border-zinc-700 rounded px-3 py-2 text-sm">
                            <button type="submit" class="w-full bg-purple-900 hover:bg-purple-800 py-1.5 rounded text-sm">Save Ingredient</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </dialog>

    <script type="module" src="js/app.js"></script>
</body>
</html>
