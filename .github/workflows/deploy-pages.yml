name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Build site with the webhook secret
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          test -n "$DISCORD_WEBHOOK_URL" || { echo "::error::Add the DISCORD_WEBHOOK_URL Actions secret"; exit 1; }
          mkdir _site
          cp index.html _site/
          cp -R css js _site/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const configPath = '_site/js/config.js';
          const source = fs.readFileSync(configPath, 'utf8');
          const placeholder = 'export const DISCORD_WEBHOOK_URL = "DISCORD_WEBHOOK_URL";';
          const webhookUrl = process.env.DISCORD_WEBHOOK_URL.trim();
          if (!source.includes(placeholder)) {
            throw new Error('Expected webhook placeholder was not found in js/config.js');
          }

          let parsedWebhookUrl;
          try {
            parsedWebhookUrl = new URL(webhookUrl);
          } catch {
            throw new Error('DISCORD_WEBHOOK_URL must be a valid Discord webhook URL');
          }
          if (
            parsedWebhookUrl.protocol !== 'https:' ||
            !['discord.com', 'discordapp.com'].includes(parsedWebhookUrl.hostname) ||
            !parsedWebhookUrl.pathname.startsWith('/api/webhooks/')
          ) {
            throw new Error('DISCORD_WEBHOOK_URL must be a valid Discord webhook URL');
          }

          const configured = source.replace(
            placeholder,
            `export const DISCORD_WEBHOOK_URL = ${JSON.stringify(webhookUrl)};`
          );
          fs.writeFileSync(configPath, configured);
          NODE

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4